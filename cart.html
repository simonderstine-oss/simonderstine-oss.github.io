<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart — Simon Demo Shop</title>
    <!--
      UTT loader FIRST, then INLINE consent+identify with zero network gap.
      This is the gold-standard sequence. Delaying these into DOMContentLoaded /
      SPA lifecycles is the failure mode clients hit (IR cookies before Accept).
    -->
    <script type="text/javascript">
      (function (a, b, c, d, e, f, g) {
        e["ire_o"] = c;
        e[c] =
          e[c] ||
          function () {
            (e[c].a = e[c].a || []).push(arguments);
          };
        f = d.createElement(b);
        g = d.getElementsByTagName(b)[0];
        f.async = 1;
        f.src = a;
        g.parentNode.insertBefore(f, g);
      })(
        "https://utt.impactcdn.com/A3318275-654b-4b94-bfb3-76b3e4e02aea1.js",
        "script",
        "ire",
        document,
        window
      );
    </script>
    <script type="text/javascript">
      (function () {
        var CONSENT_KEY = "demo_consent_tracking";
        var PROFILE_COOKIE = "demo_custom_profile_id";
        var CLICK_COOKIE = "demo_im_ref";
        function getCookie(name) {
          var m = document.cookie.match(
            new RegExp("(?:^|; )" + name.replace(/([.$?*|{}()[\]\/+^])/g, "\$1") + "=([^;]*)")
          );
          return m ? decodeURIComponent(m[1]) : "";
        }
        function setCookie(name, value, days) {
          document.cookie =
            name +
            "=" +
            encodeURIComponent(value) +
            "; path=/; max-age=" +
            days * 86400 +
            "; SameSite=Lax";
        }
        function uuid() {
          return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function (c) {
            var r = (Math.random() * 16) | 0;
            return (c === "x" ? r : (r & 0x3) | 0x8).toString(16);
          });
        }
        var stored = null;
        try {
          stored = localStorage.getItem(CONSENT_KEY);
        } catch (e) {}
        var tracking = stored === "granted" ? "granted" : "denied";
        var m = (location.search || "").match(/[?&]im_ref=([^&]*)/);
        if (m) setCookie(CLICK_COOKIE, decodeURIComponent(m[1].replace(/\+/g, " ")), 30);
        var profileId = getCookie(PROFILE_COOKIE);
        if (!profileId) {
          profileId = uuid();
          setCookie(PROFILE_COOKIE, profileId, 365);
        }
        var customer = { customerId: "", email: "" };
        try {
          var raw = sessionStorage.getItem("demo_customer");
          if (raw) customer = JSON.parse(raw);
        } catch (e) {}
        // SYNC into ire stub queue — before async UTT initializes
        ire("consent", "default", { tracking: tracking });
        ire("identify", {
          customerId: customer.customerId || "",
          customerEmail: "",
          customProfileId: profileId,
        });
        window.__IMPACT_CONSENT_HEAD_BOOT__ = {
          tracking: tracking,
          stored: stored,
          at: Date.now(),
        };
        console.log(
          "[Impact Consent] HEAD boot queued consent default=" +
            tracking +
            " + identify (before UTT init)"
        );
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/impact-consent.js"></script>
</head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html">Simon Demo Shop</a>
      <nav class="site-nav">
        <a href="index.html">Shop</a>
        <a class="cart-link" href="cart.html">
          Cart
          <span id="cart-count" hidden>0</span>
        </a>
      </nav>
    </header>

    <main>
      <div class="panel">
        <h1>Cart</h1>
        <div id="cart-empty" class="empty" hidden>Your cart is empty. <a href="index.html">Continue shopping</a>.</div>
        <table class="cart-table" id="cart-table" hidden>
          <thead>
            <tr>
              <th>Item</th>
              <th>Qty</th>
              <th>Subtotal</th>
            </tr>
          </thead>
          <tbody id="cart-body"></tbody>
        </table>
        <p id="cart-total" hidden></p>
        <div class="actions" id="cart-actions" hidden>
          <a class="btn btn--ghost" href="index.html">Keep shopping</a>
          <a class="btn btn--primary" href="checkout.html">Checkout</a>
        </div>
      </div>
    </main>

    <footer class="site-footer">UTT + consent default + identify on every page</footer>

    <script src="js/banner.js"></script>
    <script src="js/boot.js"></script>
    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script>
      function renderCart() {
        var items = DemoCart.getLineItems();
        var empty = document.getElementById("cart-empty");
        var table = document.getElementById("cart-table");
        var body = document.getElementById("cart-body");
        var total = document.getElementById("cart-total");
        var actions = document.getElementById("cart-actions");

        if (!items.length) {
          empty.hidden = false;
          table.hidden = true;
          total.hidden = true;
          actions.hidden = true;
          return;
        }

        empty.hidden = true;
        table.hidden = false;
        total.hidden = false;
        actions.hidden = false;
        body.innerHTML = items
          .map(function (item) {
            return (
              "<tr>" +
              "<td><strong>" +
              item.name +
              "</strong><div class=\"meta\">" +
              item.sku +
              " · " +
              item.category +
              "</div></td>" +
              '<td><div class="qty-controls">' +
              '<button type="button" data-qty="' +
              item.sku +
              '" data-delta="-1">−</button>' +
              "<span>" +
              item.quantity +
              "</span>" +
              '<button type="button" data-qty="' +
              item.sku +
              '" data-delta="1">+</button>' +
              "</div></td>" +
              "<td>" +
              DemoCart.formatMoney(item.subTotal) +
              "</td>" +
              "</tr>"
            );
          })
          .join("");
        total.innerHTML = "<strong>Subtotal:</strong> " + DemoCart.formatMoney(DemoCart.getSubtotal());
      }

      document.getElementById("cart-body").addEventListener("click", function (e) {
        var btn = e.target.closest("[data-qty]");
        if (!btn) return;
        var sku = btn.getAttribute("data-qty");
        var delta = Number(btn.getAttribute("data-delta"));
        var line = DemoCart.getLineItems().find(function (i) {
          return i.sku === sku;
        });
        if (!line) return;
        DemoCart.setQty(sku, line.quantity + delta);
        renderCart();
      });

      renderCart();
    </script>
  </body>
</html>
